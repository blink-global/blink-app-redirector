name: Deploy Deep Link Files
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Deploy to server
      run: |
        echo "$SSH_PRIVATE_KEY" > key
        chmod 600 key
        rsync -av --delete -e "ssh -i key" ./ ${{ secrets.SERVER_USER }}:/var/www/
        ssh -i key ${{ secrets.SERVER_USER }} "sudo chown -R www-data:www-data /var/www && sudo chmod -R 755 /var/www"
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
